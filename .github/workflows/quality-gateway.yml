name: Quality Gateway

on:
  push:
  pull_request:

jobs:
  quality-gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: install toolchain
        run: |
          sudo apt update && sudo apt install -y curl unzip make git luarocks
          sudo luarocks install luacheck
          curl -LO https://github.com/JohnnyMorganz/StyLua/releases/latest/download/stylua-linux-x86_64.zip
          unzip stylua-linux-x86_64.zip && chmod +x stylua && sudo mv stylua /usr/local/bin/

          curl -LO https://github.com/MordechaiHadad/bob/releases/download/v4.1.7/bob-linux-x86_64.zip
          unzip bob-linux-x86_64.zip && chmod +x ./bob-linux-x86_64/bob
          ./bob-linux-x86_64/bob use stable
          echo "$HOME/.local/share/bob/nvim-bin" >> "$GITHUB_PATH"

      - name: format check
        run: make fmt-check

      - name: lint
        run: make lint

      - name: tests
        run: make tests